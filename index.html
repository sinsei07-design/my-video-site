<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JP Vault Video</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      text-align: center;
      padding-top: 80px;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }
    p {
      color: #cccccc;
      margin-bottom: 30px;
    }
    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      background-color: #e63946;
      color: white;
      font-weight: bold;
      margin-left: 10px;
      cursor: pointer;
    }
    .tags {
      margin-top: 40px;
    }
    .tag-button {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 20px;
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .tag-button:hover {
      background-color: #e63946;
      border-color: #e63946;
    }
  </style>
</head>
<body>

  <h1>JP Vault Video</h1>
  <p>Search Japanese videos and images</p>

  <input type="text" id="searchBox" placeholder="Search...">
  <button onclick="doSearch()">Search</button>

  <div class="tags">
    <button class="tag-button" onclick="quickSearch('ランキング')">Ranking</button>
    <button class="tag-button" onclick="quickSearch('新作')">New</button>
    <button class="tag-button" onclick="quickSearch('人気')">Popular</button>
  </div>

  <script>
    function doSearch() {
      var keyword = document.getElementById("searchBox").value;
      if (keyword === "") {
        alert("Please enter a search word");
        return;
      }
      openDmmSearch(keyword);
    }

    function quickSearch(keyword) {
      openDmmSearch(keyword);
    }

    function openDmmSearch(keyword) {
      var url = "https://www.dmm.co.jp/search/=/searchstr=" + encodeURIComponent(keyword) + "/";
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
