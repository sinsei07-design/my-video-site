<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JP Vault Video</title>
  <style>
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #ffe4ec 0%, #fff5f7 40%, #f7f8fa 100%);
      color: #222222;
      text-align: center;
      padding-top: 50px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .petals {
      font-size: 24px;
      margin-bottom: 10px;
      letter-spacing: 12px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #333333;
    }
    p.subtitle {
      color: #777777;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .search-area {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow: 0 4px 16px rgba(255, 182, 193, 0.3);
    }
    input {
      padding: 12px;
      width: 250px;
      border-radius: 8px;
      border: 1px solid #f0d0d8;
      font-size: 14px;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background-color: #f472a0;
      color: white;
      font-weight: bold;
      margin-left: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #ec4899;
    }
    .tags {
      margin-top: 20px;
    }
    .tag-button {
      background-color: #fff0f4;
      color: #b5497a;
      border: 1px solid #f5d0dd;
      border-radius: 20px;
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      font-size: 13px;
    }
    .tag-button:hover {
      background-color: #ffe0eb;
    }
    .notice {
      margin-top: 30px;
      color: #999999;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="petals">🌸 🌸 🌸</div>
    <h1>JP Vault Video</h1>
    <p class="subtitle">Discover and search Japanese videos, made simple</p>

    <div class="search-area">
      <input type="text" id="searchBox" placeholder="Search...">
      <button onclick="doSearch()">Search</button>

      <div class="tags">
        <button class="tag-button" onclick="quickSearch('ランキング')">Ranking</button>
        <button class="tag-button" onclick="quickSearch('新作')">New</button>
        <button class="tag-button" onclick="quickSearch('人気')">Popular</button>
      </div>
    </div>

    <p class="notice">This site helps you search and discover content.<br>Search results are provided by external services.</p>
  </div>

  <script>
    function doSearch() {
      var keyword = document.getElementById("searchBox").value;
      if (keyword === "") {
        alert("Please enter a search word");
        return;
      }
      openDmmSearch(keyword);
    }

    function quickSearch(keyword) {
      openDmmSearch(keyword);
    }

    function openDmmSearch(keyword) {
      var url = "https://www.dmm.co.jp/search/=/searchstr=" + encodeURIComponent(keyword) + "/";
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
