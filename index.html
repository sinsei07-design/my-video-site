<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Vault Video</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #fffdfc 0%, #fff5f7 60%, #ffecf1 100%);
      color: #222222;
      text-align: center;
      padding-top: 40px;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #7a3b57;
    }
    p.subtitle {
      color: #a0607c;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .search-area {
      background-color: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      padding: 24px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    input {
      padding: 12px;
      width: 100%;
      max-width: 250px;
      border-radius: 8px;
      border: 1px solid #f0d0d8;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background-color: #f472a0;
      color: white;
      font-weight: bold;
      margin-left: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #ec4899;
    }
    .tags {
      margin-top: 20px;
    }
    .tag-button {
      background-color: #fff0f4;
      color: #b5497a;
      border: 1px solid #f5d0dd;
      border-radius: 20px;
      padding: 8px 14px;
      margin: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .tag-button:hover {
      background-color: #ffe0eb;
    }
    .popular-area {
      background-color: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      padding: 20px 16px;
      margin-top: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-align: left;
    }
    .popular-area h2 {
      font-size: 16px;
      color: #7a3b57;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .popular-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .popular-list li {
      padding: 10px 8px;
      border-bottom: 1px solid #f5e2e8;
      cursor: pointer;
      font-size: 14px;
      color: #444444;
      display: flex;
      align-items: center;
    }
    .popular-list li:last-child {
      border-bottom: none;
    }
    .popular-list li:hover {
      background-color: #fff0f4;
    }
    .rank-num {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      background-color: #f472a0;
      color: white;
      border-radius: 50%;
      font-size: 12px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .articles-area {
      background-color: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      padding: 20px 16px;
      margin-top: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-align: left;
    }
    .articles-area h2 {
      font-size: 16px;
      color: #7a3b57;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .article-link {
      display: block;
      padding: 10px 8px;
      border-bottom: 1px solid #f5e2e8;
      color: #444444;
      text-decoration: none;
      font-size: 14px;
    }
    .article-link:last-child {
      border-bottom: none;
    }
    .article-link:hover {
      background-color: #fff0f4;
    }
    .footer-links {
      margin-top: 30px;
      font-size: 12px;
    }
    .footer-links a {
      color: #a0607c;
      margin: 0 8px;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    .notice {
      margin-top: 15px;
      color: #999999;
      font-size: 12px;
      line-height: 1.6;
      padding-bottom: 30px;
    }
    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.9;
    }
    @media (max-width: 480px) {
      body {
        padding-top: 24px;
      }
      h1 {
        font-size: 24px;
      }
      input {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
      }
      button {
        width: 100%;
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>

    <path d="M0 260 C 60 210, 120 230, 170 190 C 210 160, 250 150, 300 120" fill="none" stroke="#8a6a5f" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

      <circle r="5" fill="#ffd23f"/>
    </g>

      <use href="#petalShape" transform="rotate(-15)"/><use href="#petalShape" transform="rotate(57)"/><use href="#petalShape" transform="rotate(129)"/><use href="#petalShape" transform="rotate(201)"/><use href="#petalShape" transform="rotate(273)"/>
      <circle r="5" fill="#ffd23f"/>

      <use href="#petalShape" transform="rotate(5)"/><use href="#petalShape" transform="rotate(77)"/><use href="#petalShape" transform="rotate(149)"/><use href="#petalShape" transform="rotate(221)"/><use href="#petalShape" transform="rotate(293)"/>
      <circle r="5" fill="#ffd23f"/>
    </g>
    <g transform="translate(80,230) scale(0.5)" opacity="0.8">
      <use href="#petalShape" transform="rotate(0)"/><use href="#petalShape" transform="rotate(72)"/><use href="#petalShape" transform="rotate(144)"/><use href="#petalShape" transform="rotate(216)"/><use href="#petalShape" transform="rotate(288)"/>
      <circle r="5" fill="#ffd23f"/>
    </g>
    <g fill="#ffc7dc" opacity="0.7">
      <ellipse cx="80" cy="60" rx="7" ry="5" transform="rotate(30 80 60)"/>
      <ellipse cx="380" cy="70" rx="7" ry="5" transform="rotate(50 380 70)"/>
      <ellipse cx="600" cy="90" rx="7" ry="5" transform="rotate(-40 600 90)"/>
      <ellipse cx="140" cy="300" rx="7" ry="5" transform="rotate(-20 140 300)"/>
      <ellipse cx="450" cy="320" rx="7" ry="5" transform="rotate(10 450 320)"/>
    </g>
  </svg>

  <div class="container">
    <h1>JP Vault Video</h1>
    <p class="subtitle">お探しの動画を、かんたん検索</p>

    <div class="search-area">
      <input type="text" id="searchBox" placeholder="キーワードを入力">
      <button onclick="doSearch()">検索</button>

      <div class="tags">
        <button class="tag-button" onclick="quickSearch('ランキング')">ランキング</button>
        <button class="tag-button" onclick="quickSearch('新作')">新作</button>
        <button class="tag-button" onclick="quickSearch('人気')">人気</button>
        <button class="tag-button" onclick="quickSearch('素人')">素人</button>
        <button class="tag-button" onclick="quickSearch('高画質')">高画質</button>
        <button class="tag-button" onclick="quickSearch('おすすめ')">おすすめ</button>
      </div>
    </div>

    <div class="popular-area">
      <h2>人気検索ワード</h2>
      <ul class="popular-list">
        <li onclick="quickSearch('コスプレ')"><span class="rank-num">1</span>コスプレ</li>
        <li onclick="quickSearch('制服')"><span class="rank-num">2</span>制服</li>
        <li onclick="quickSearch('和服')"><span class="rank-num">3</span>和服</li>
        <li onclick="quickSearch('メイド')"><span class="rank-num">4</span>メイド</li>
        <li onclick="quickSearch('巫女')"><span class="rank-num">5</span>巫女</li>
      </ul>
    </div>

    <div class="articles-area">
      <h2>コラム・ガイド</h2>
      <a class="article-link" href="guide.html">サイトの使い方ガイド</a>
      <a class="article-link" href="culture.html">人気コスチュームジャンル紹介</a>
      <a class="article-link" href="cosplay-guide.html">コスプレコンテンツの楽しみ方</a>
    </div>

    <div class="footer-links">
      <a href="about.html">このサイトについて</a> |
      <a href="contact.html">お問い合わせ</a> |
      <a href="privacy.html">プライバシーポリシー</a>
    </div>

    <p class="notice">このサイトはコンテンツの検索をサポートします。<br>検索結果は外部サービスにより提供されます。</p>
  </div>

  <script>
    function doSearch() {
      var keyword = document.getElementById("searchBox").value;
      if (keyword === "") {
        alert("検索ワードを入力してください");
        return;
      }
      openDmmSearch(keyword);
    }
    function quickSearch(keyword) {
      openDmmSearch(keyword);
    }
    function openDmmSearch(keyword) {
      var url = "https://www.dmm.co.jp/search/=/searchstr=" + encodeURIComponent(keyword) + "/";
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
